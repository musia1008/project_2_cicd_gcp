name: Provider schema refresh

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/provider-schemas.yml
      - provider-schemas.json
      - renovate.json
      - scripts/validate_provider_schemas.py
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out consumer
        uses: actions/checkout@v4

      - name: Require configured STS endpoint
        env:
          GHEC_STS_DOMAIN: ${{ vars.GHEC_STS_DOMAIN }}
        run: |
          if [ -z "$GHEC_STS_DOMAIN" ]; then
            echo "::error::Set the GHEC_STS_DOMAIN repository variable to the configured GHEC STS service hostname."
            exit 1
          fi

      - name: Exchange GitHub OIDC token for provider read token
        id: provider-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          domain: ${{ vars.GHEC_STS_DOMAIN }}
          scope: musain11/master_project_complete
          identity: project_2_cicd_gcp

      - name: Check out provider schemas
        uses: actions/checkout@v4
        with:
          repository: musain11/master_project_complete
          ref: dev
          token: ${{ steps.provider-sts.outputs.token }}
          path: provider-source
          persist-credentials: false

      - name: Validate provider BigQuery contract JSON
        run: python scripts/validate_provider_schemas.py provider-source/contracts/bigquery

      - name: Publish provider schema bundle
        uses: actions/upload-artifact@v4
        with:
          name: provider-bigquery-contracts-${{ github.sha }}
          path: provider-source/contracts/bigquery/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Configure Renovate access to provider refs
        env:
          PROVIDER_TOKEN: ${{ steps.provider-sts.outputs.token }}
        run: |
          node -e 'const fs = require("node:fs"); const token = process.env.PROVIDER_TOKEN; if (!token) throw new Error("STS did not return a provider token"); const rules = [{ matchHost: "github.com", hostType: "git-refs", token }]; fs.appendFileSync(process.env.GITHUB_ENV, `RENOVATE_HOST_RULES=${JSON.stringify(rules)}\n`);'

      - name: Run Renovate
        uses: renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776 # v46.3.10
        with:
          token: ${{ github.token }}
          configurationFile: renovate.json
        env:
          LOG_LEVEL: info
          RENOVATE_BASE_BRANCHES: '["dev"]'
