name: Terraform BigQuery Deployment

on:
  push:
    branches:
      - dev
      - test
      - prod
  pull_request:
    branches:
      - dev
      - test
      - prod

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Select branch environment
        shell: bash
        run: |
          DEPLOY_BRANCH="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then DEPLOY_BRANCH="${GITHUB_BASE_REF}"; fi
          case "${DEPLOY_BRANCH}" in
            dev) DATASET_ID="temp_dev"; TABLE_ID="student_dev" ;;
            test) DATASET_ID="temp_test"; TABLE_ID="student_test" ;;
            prod) DATASET_ID="temp_prod"; TABLE_ID="student_prod" ;;
            *) echo "Unsupported deployment branch: ${DEPLOY_BRANCH}"; exit 1 ;;
          esac
          echo "DEPLOY_BRANCH=${DEPLOY_BRANCH}" >> "${GITHUB_ENV}"
          echo "TF_VAR_dataset_id=${DATASET_ID}" >> "${GITHUB_ENV}"
          echo "TF_VAR_table_id=${TABLE_ID}" >> "${GITHUB_ENV}"
          echo "TF_STATE_PREFIX=terraform/state/${DEPLOY_BRANCH}" >> "${GITHUB_ENV}"

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="prefix=${TF_STATE_PREFIX}"

      - name: Terraform format check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan
        if: github.event_name == 'pull_request'
        working-directory: terraform
        run: terraform plan -input=false -no-color

      - name: Terraform apply
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/test' || github.ref == 'refs/heads/prod')
        working-directory: terraform
        run: terraform apply -input=false -auto-approve
